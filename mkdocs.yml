site_name: Mango Labs
site_url: https://mango-labs.dev
site_description: Android apps by Mango Labs — crafted with care, released on Google Play.
site_author: Mango Labs

theme:
  name: material
  language: en
  icon:
    logo: material/android
  favicon: assets/images/favicon.png
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link

plugins:
  - search
  - tags
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: material/google-play
      link: https://play.google.com/store/apps/dev?id=YOUR_DEVELOPER_ID
      name: Mango Labs on Google Play
    - icon: fontawesome/brands/github
      link: https://github.com/mango-labs
      name: Mango Labs on GitHub

nav:
  - Home: index.md
  - Apps:
      - apps/index.md
      - Sample App:
          - apps/sample-app/index.md
          - Release Notes: apps/sample-app/releases.md
  - About: about.md
